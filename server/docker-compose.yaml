services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: marketplace-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: MARKETPLACE
      POSTGRES_PASSWORD: MARKETPLACE
      POSTGRES_DB: Marketplace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MARKETPLACE -d Marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: marketplace-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: marketplace-server

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data: